<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>EchoDo - Voice-Enabled Task Management</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }\n        input[type='text'] { width: 300px; padding: 10px; margin-right: 10px; }\n        button { padding: 10px 15px; }\n        ul { list-style-type: none; padding: 0; }\n        li { padding: 8px; margin: 5px 0; border: 1px solid #ccc; }\n    </style>\n</head>\n<body>\n    <h1>Welcome to EchoDo</h1>\n    <input type="text" id="taskInput" placeholder="Add a new task">\n    <button id="addTaskBtn">Add Task</button>\n    <h2>Your Tasks</h2>\n    <ul id="taskList"></ul>\n    <script>\n        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];\n        const taskList = document.getElementById('taskList');\n        const taskInput = document.getElementById('taskInput');\n        const addTaskBtn = document.getElementById('addTaskBtn');\n\n        function displayTasks() {\n            taskList.innerHTML = '';\n            tasks.forEach((task, index) => {\n                const li = document.createElement('li');\n                li.textContent = task;\n                li.addEventListener('click', () => { removeTask(index); });\n                taskList.appendChild(li);\n            });\n        }\n\n        function addTask() {\n            if (taskInput.value) {\n                tasks.push(taskInput.value);\n                localStorage.setItem('tasks', JSON.stringify(tasks));\n                taskInput.value = '';\n                displayTasks();\n            }\n        }\n\n        function removeTask(index) {\n            tasks.splice(index, 1);\n            localStorage.setItem('tasks', JSON.stringify(tasks));\n            displayTasks();\n        }\n\n        addTaskBtn.addEventListener('click', addTask);\n\n        // Voice Command Functionality\n        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;\n        const recognition = new SpeechRecognition();\n        recognition.lang = 'en-US';\n        recognition.interimResults = false;\n\n        recognition.addEventListener('result', (e) => {\n            const task = e.results[0][0].transcript;\n            tasks.push(task);\n            localStorage.setItem('tasks', JSON.stringify(tasks));\n            displayTasks();\n        });\n\n        recognition.addEventListener('end', recognition.start);\n        recognition.start();\n\n        displayTasks();\n    </script>\n</body>\n</html>
